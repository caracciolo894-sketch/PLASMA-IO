<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PLASMA.io</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#05060a;color:#e9eef8;font-family:Inter,system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block;cursor:crosshair}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 50%,rgba(0,0,0,.65) 100%)}
#hud{position:fixed;inset:0;pointer-events:none}
.box{background:rgba(8,10,16,.66);border:1px solid rgba(255,255,255,.09);border-radius:10px}
#stats{position:absolute;left:14px;top:12px;padding:10px 14px;font-size:13px;color:#9aa6bf;line-height:1.5}
#stats b{font-family:Rajdhani;font-size:30px;color:#fff;font-weight:700;line-height:1}
#lb{position:absolute;right:14px;top:12px;width:210px;padding:10px 12px;font-size:13px}
#lb h3{font-family:Rajdhani;font-size:13px;letter-spacing:3px;color:#8792ab;margin-bottom:5px}
#lb .row{display:flex;justify-content:space-between;gap:8px;padding:1px 0;white-space:nowrap}
#lb .row span:first-child{overflow:hidden;text-overflow:ellipsis}
#lb .me{color:#fff;font-weight:800}
#lb i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
#feed{position:absolute;left:50%;top:12px;transform:translateX(-50%);text-align:center;font-size:13px;width:min(420px,50vw)}
#feed div{margin:0 auto 4px;display:table;padding:4px 10px;animation:fade 4s forwards;will-change:opacity}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}
#banner{position:absolute;left:50%;top:20%;transform:translateX(-50%);text-align:center;opacity:0;white-space:nowrap;will-change:transform,opacity;contain:layout paint}
#banner.show{animation:ban 2.6s ease-out forwards}
#banner .t{font-family:Rajdhani;font-weight:700;font-size:clamp(26px,5.2vw,54px);letter-spacing:4px}
#banner .s{font-size:clamp(12px,2.2vw,16px);color:#cfd8ea;letter-spacing:2px;margin-top:2px}
@keyframes ban{0%{opacity:0;transform:translateX(-50%) scale(1.6)}10%{opacity:1;transform:translateX(-50%) scale(1)}75%{opacity:1}100%{opacity:0}}
#cds{position:absolute;left:50%;bottom:16px;transform:translateX(-50%)}
.cd{padding:7px 12px;display:flex;align-items:center;gap:8px;font-family:Rajdhani;font-weight:700;font-size:14px;letter-spacing:2px;color:#9aa6bf}
.cd>div{width:110px;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.cd i{display:block;height:100%;width:100%}
.cd kbd{font-family:Inter;font-size:10px;background:rgba(255,255,255,.1);border-radius:4px;padding:1px 5px}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(5,6,10,.35),rgba(5,6,10,.93));z-index:5;overflow:auto}
.panel{text-align:center;padding:20px;max-width:640px;width:95%;margin:auto}
h1{font-family:Rajdhani;font-weight:700;font-size:clamp(50px,12vw,88px);letter-spacing:8px;line-height:1;color:#fff;text-shadow:0 0 18px var(--c,#28c8ff),0 0 50px var(--c,#28c8ff)}
.sub{color:#9aa6bf;margin:8px 0 16px;font-size:15px;letter-spacing:1px}
input{width:100%;max-width:420px;padding:12px 16px;font-size:17px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(15,18,28,.9);color:#fff;outline:none;text-align:center;font-family:Inter}
input:focus{border-color:var(--c,#28c8ff)}
.lbl{font-family:Rajdhani;font-size:13px;letter-spacing:3px;color:#8792ab;margin:14px 0 8px}
#colors{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
#colors div{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .1s}
#colors div.sel{border-color:#fff;transform:scale(1.15)}
#colors .rnd{background:conic-gradient(#ff2a3d,#ffd23d,#3dff6e,#28c8ff,#b04dff,#ff2a3d);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#000}
#models{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.model{position:relative;padding:7px 6px 8px;border-radius:10px;background:rgba(15,18,28,.9);border:1px solid rgba(255,255,255,.1);cursor:pointer;overflow:hidden}
.model.sel{border-color:var(--c,#28c8ff);box-shadow:0 0 16px -4px var(--c,#28c8ff)}
.model canvas{width:100%;height:42px}
.model b{display:block;font-family:Rajdhani;font-size:15px;letter-spacing:1px;margin:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:flex;align-items:center;gap:5px;font-size:9px;color:#8792ab;letter-spacing:1px;margin-top:2px}
.st span{width:58px;text-align:left}
.st div{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.st i{display:block;height:100%;background:var(--c,#28c8ff)}
.lock{position:absolute;left:0;right:0;bottom:0;top:66px;background:rgba(5,6,10,.85);display:flex;align-items:center;justify-content:center;font-size:11px;color:#c4cbe0;padding:4px 6px;gap:6px}
.model.locked canvas,.model.locked b{opacity:.55}
.lock big{font-size:15px}
.shake{animation:sk .3s}
@keyframes sk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#prog{font-size:12px;color:#8792ab;margin-top:6px}
.opts{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:#8792ab;align-items:center}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.15);border-radius:8px;overflow:hidden}
.seg button{background:transparent;color:#9aa6bf;border:0;padding:5px 10px;font-size:12px;cursor:pointer}
.seg button.on{background:var(--c,#28c8ff);color:#05060a;font-weight:700}
select{background:rgba(15,18,28,.9);color:#dfe6f5;border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:5px 8px;font-size:12px}
button.play{margin-top:16px;width:100%;max-width:420px;padding:14px;font-family:Rajdhani;font-size:26px;font-weight:700;letter-spacing:6px;border:0;border-radius:10px;cursor:pointer;color:#05060a;background:var(--c,#28c8ff);box-shadow:0 0 30px -4px var(--c,#28c8ff)}
.help{margin-top:14px;font-size:12.5px;color:#8792ab;line-height:1.8}
.help kbd{background:rgba(255,255,255,.1);border-radius:4px;padding:1px 6px;font-family:inherit;color:#dfe6f5}
.dstat{display:flex;justify-content:center;gap:26px;margin:16px 0 4px;flex-wrap:wrap}
.dstat div{font-size:12px;color:#8792ab}.dstat b{display:block;font-family:Rajdhani;font-size:34px;color:#fff}
#mob{position:fixed;right:18px;bottom:18px;display:none;z-index:4}
#mob div{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-family:Rajdhani;font-weight:700;font-size:13px;letter-spacing:1px}
#shop,#quests{background:rgba(5,6,10,.97)}
#shop .panel{max-width:760px}
.tabs{display:flex;gap:6px;justify-content:center;margin:10px 0 12px}
.tabs button{background:rgba(15,18,28,.9);color:#9aa6bf;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:7px 14px;font-family:Rajdhani;font-weight:700;letter-spacing:2px;font-size:14px;cursor:pointer}
.tabs button.on{border-color:var(--c,#28c8ff);color:#fff;box-shadow:0 0 14px -4px var(--c,#28c8ff)}
#shopGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{border-radius:12px;background:rgba(15,18,28,.92);border:1px solid rgba(255,255,255,.1);padding:8px;display:flex;flex-direction:column;gap:6px}
.item.eq{border-color:var(--c,#28c8ff);box-shadow:0 0 18px -6px var(--c,#28c8ff)}
.item canvas{width:100%;height:84px;border-radius:8px;background:#07080d}
.item b{font-family:Rajdhani;font-size:17px;letter-spacing:1px}
.item{position:relative;overflow:hidden}
.item .rb{position:absolute;left:8px;top:8px;font-size:9px;font-weight:800;letter-spacing:1.5px;padding:2px 6px;border-radius:5px;background:rgba(0,0,0,.6);z-index:2}
.item.rL,.item.rM{animation:rp 2.4s ease-in-out infinite}
.item.rL::after,.item.rM::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.12),transparent);animation:shine 3s infinite;pointer-events:none}
@keyframes shine{0%{left:-60%}60%,100%{left:130%}}
@keyframes rp{50%{box-shadow:0 0 22px -6px var(--rc)}}
#payNote{font-size:11px;color:#7fd8a0;margin-top:6px}
#perks{margin:8px auto 0;font-size:12px;font-weight:700;color:#5dffa0;min-height:16px;letter-spacing:.03em}#perks small{color:#8792ab;font-weight:800;margin-right:6px;font-size:10px;letter-spacing:.12em}
.item .perk{font-size:12px;font-weight:800;color:#5dffa0;letter-spacing:.04em;margin-top:-4px;text-shadow:0 0 8px #5dffa066}
#netSt{font-size:12px;color:#8792ab;margin:2px 0 8px;min-height:15px;font-weight:600;letter-spacing:.03em}#netSt i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;box-shadow:0 0 8px currentColor;vertical-align:1px}
.item .desc{font-size:11px;color:#8792ab;min-height:15px;margin-top:-4px}
.item .row2{display:flex;gap:6px}
.item button{flex:1;border:0;border-radius:8px;padding:7px 4px;font-family:Rajdhani;font-weight:700;font-size:14px;letter-spacing:1px;cursor:pointer}
.bBuy{background:#ffd23d;color:#1a1400}
.bEq{background:var(--c,#28c8ff);color:#05060a}
.bIn{background:rgba(255,255,255,.08);color:#9aa6bf;cursor:default!important}
.bCode{background:rgba(255,255,255,.08);color:#ffd23d;flex:0 0 auto!important;padding:7px 8px!important}
#ownerBadge{display:inline-block;margin-top:6px;padding:5px 12px;border-radius:20px;background:rgba(255,210,61,.12);border:1px solid rgba(255,210,61,.5);color:#ffd23d;font-size:12px;font-weight:700;letter-spacing:1px}
.coderow{display:flex;gap:8px;justify-content:center;margin-top:14px}
.coderow input{max-width:260px;padding:9px 12px;font-size:14px;text-transform:uppercase}
.coderow button{border:0;border-radius:10px;padding:0 16px;font-family:Rajdhani;font-weight:700;letter-spacing:2px;background:var(--c,#28c8ff);color:#05060a;cursor:pointer}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9;background:rgba(10,12,20,.96);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px 16px;font-size:14px;max-width:92vw;text-align:center;display:none}
#toast code{font-family:Rajdhani;font-size:20px;letter-spacing:2px;color:#ffd23d;display:block;margin:6px 0;user-select:text;-webkit-user-select:text}
#toast button{margin:2px 4px 0;border:0;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer}
.cos{font-size:11px;color:#8792ab;margin-top:6px}
button.shopBtn{margin-top:10px;width:100%;max-width:420px;padding:10px;font-family:Rajdhani;font-size:18px;font-weight:700;letter-spacing:4px;border-radius:10px;cursor:pointer;color:#ffd23d;background:rgba(255,210,61,.07);border:1px solid rgba(255,210,61,.4)}
.ci{width:22px;height:22px;flex:0 0 auto;filter:drop-shadow(0 0 4px rgba(255,200,61,.55))}
#topbar{position:fixed;right:14px;top:12px;z-index:7;display:flex;gap:10px;align-items:center}
.wallet{display:inline-flex;align-items:center;gap:8px;padding:5px 6px 5px 7px;border-radius:999px;background:linear-gradient(180deg,rgba(46,36,8,.95),rgba(18,14,4,.95));border:1px solid rgba(255,210,61,.55);box-shadow:0 0 20px -6px #ffd23d,inset 0 1px 0 rgba(255,255,255,.14)}
.wallet .ci{width:26px;height:26px}
.wallet b{font-family:Rajdhani;font-size:21px;font-weight:700;color:#ffeab0;letter-spacing:1px;min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
.wallet button{width:26px;height:26px;border-radius:50%;border:0;background:linear-gradient(180deg,#ffe17a,#e0a01a);color:#2a1a00;font-weight:900;font-size:17px;line-height:1;cursor:pointer;box-shadow:0 2px 0 #8a5a05}
.wallet.pop{animation:wpop .5s}
@keyframes wpop{40%{transform:scale(1.12)}}
.qbtn{position:relative;padding:9px 14px;border-radius:999px;border:1px solid rgba(127,216,255,.45);background:rgba(10,16,28,.92);color:#cfe8ff;font-family:Rajdhani;font-weight:700;letter-spacing:2px;font-size:14px;cursor:pointer}
.qbtn i{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:#ff3355;color:#fff;font-style:normal;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 0 10px #ff3355}
#sess{position:absolute;left:14px;top:96px;padding:6px 10px;display:flex;align-items:center;gap:6px}
#sess b{font-family:Rajdhani;font-size:18px;color:#ffeab0}
.qrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:rgba(15,18,28,.92);border:1px solid rgba(255,255,255,.08);margin-bottom:10px;text-align:left}
.qrow.done{border-color:rgba(255,210,61,.55);box-shadow:0 0 18px -8px #ffd23d}
.qrow .qt{flex:1;font-size:14px;color:#e9eef8}
.qrow .qb{height:7px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
.qrow .qb i{display:block;height:100%;background:linear-gradient(90deg,#7fd8ff,#ffd23d)}
.qrow .qp{font-size:11px;color:#8792ab;margin-top:3px}
.qrw{display:flex;align-items:center;gap:4px;font-family:Rajdhani;font-weight:700;font-size:17px;color:#ffeab0}
.qrow button{border:0;border-radius:9px;padding:8px 12px;font-family:Rajdhani;font-weight:700;letter-spacing:1px;background:linear-gradient(180deg,#ffe17a,#e0a01a);color:#2a1a00;cursor:pointer;box-shadow:0 2px 0 #8a5a05}
.qrow button:disabled{background:rgba(255,255,255,.08);color:#8792ab;box-shadow:none;cursor:default}
.qdaily{font-size:12px;color:#8792ab;margin:6px 0 4px}
#earn{display:flex;flex-direction:column;align-items:center;gap:4px;margin:12px auto 4px;padding:12px 18px;border-radius:14px;background:linear-gradient(180deg,rgba(46,36,8,.6),rgba(18,14,4,.6));border:1px solid rgba(255,210,61,.35);max-width:320px}
#earn .er{display:flex;justify-content:space-between;width:100%;font-size:13px;color:#cbbd8a}
#earn .et{display:flex;align-items:center;gap:8px;font-family:Rajdhani;font-weight:700;font-size:32px;color:#ffeab0;margin-top:4px}
#earn .et .ci{width:30px;height:30px}
.pbtn{display:inline-flex;align-items:center;justify-content:center;gap:5px}
.pbtn .ci{width:18px;height:18px;filter:none}
.pack .amt{display:flex;align-items:center;justify-content:center;gap:6px;font-family:Rajdhani;font-weight:700;font-size:24px;color:#ffeab0}
.pack .amt .ci{width:24px;height:24px}
.pack .bb{position:absolute;right:12px;top:72px;font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;background:#ff3355;color:#fff;z-index:2}
.hidden{display:none!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="cgA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff5c2"/><stop offset=".45" stop-color="#ffc83d"/><stop offset="1" stop-color="#a86a06"/></linearGradient>
<linearGradient id="cgB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffdf6e"/><stop offset="1" stop-color="#d18d0e"/></linearGradient>
<symbol id="coin" viewBox="0 0 32 32"><polygon points="16,1 29.5,8.75 29.5,23.25 16,31 2.5,23.25 2.5,8.75" fill="url(#cgA)" stroke="#6b4304" stroke-width="1.3"/><polygon points="16,5.2 25.8,10.9 25.8,21.1 16,26.8 6.2,21.1 6.2,10.9" fill="url(#cgB)" stroke="rgba(255,255,255,.45)" stroke-width="1"/><path d="M19.6 11.6c-.9-.9-2.2-1.4-3.6-1.4-2.2 0-3.7 1.2-3.7 2.9 0 1.8 1.6 2.4 3.5 2.9 1.7.4 2.4.8 2.4 1.6 0 .9-1 1.5-2.3 1.5-1.4 0-2.6-.6-3.3-1.5" fill="none" stroke="#3d2700" stroke-width="2.1" stroke-linecap="round"/><path d="M16 8.4v15.2" stroke="#3d2700" stroke-width="1.9" stroke-linecap="round"/><path d="M6.5 10.5L16 5l9.5 5.5" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="1.1"/></symbol>
</defs></svg>
<canvas id="c"></canvas><div id="vig"></div>
<div id="topbar" class="hidden">
  <button id="qBtn" class="qbtn"><span data-t="questsB"></span><i id="qBadge" class="hidden">0</i></button>
  <div class="wallet" id="wallet"><svg class="ci"><use href="#coin"/></svg><b id="wAmt">0</b><button id="wPlus" title="+">+</button></div>
</div>
<div id="hud" class="hidden">
  <div id="stats" class="box"></div>
  <div id="sess" class="box"><svg class="ci"><use href="#coin"/></svg><b id="sessAmt">0</b></div>
  <div id="lb" class="box"></div>
  <div id="feed"></div>
  <div id="banner"><div class="t"></div><div class="s"></div></div>
  <div id="cds"><div class="cd box"><span data-t="dash"></span> <kbd>SPACE</kbd> <small style="font-family:Inter;font-size:10px">−3%</small><div><i id="cdDash"></i></div></div></div>
</div>
<div id="mob"><div id="bDash" data-t="dash"></div></div>

<div id="start" class="overlay"><div class="panel">
  <h1>PLASMA</h1>
  <p class="sub" data-t="sub"></p>
  <input id="name" maxlength="14" autocomplete="off">
  <div class="lbl" data-t="color"></div><div id="colors"></div>
  <div class="lbl" data-t="blade"></div><div id="models"></div>
  <div id="prog"></div><div id="netSt"></div>
  <button class="play" id="play" data-t="play"></button><br>
  <button class="shopBtn" id="openShop">✦ <span data-t="shop"></span></button>
  <div id="perks"></div>
  <div class="opts">
    <span><span data-t="names"></span>: <span class="seg" id="namesSeg"><button data-v="en">English</button><button data-v="loc" id="locBtn"></button></span></span>
    <span><span data-t="gfx"></span>: <span class="seg" id="gfxSeg"><button data-v="2" data-t="gHigh"></button><button data-v="1" data-t="gMed"></button><button data-v="0" data-t="gLow"></button></span></span>
    <span><span data-t="lang"></span>: <select id="langSel"><option value="it">Italiano</option><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="pt">Português</option></select></span>
  </div>
  <div class="help" id="helpD" data-th="helpD"></div>
  <div class="help hidden" id="helpT" data-t="helpT"></div>
</div></div>

<div id="shop" class="overlay hidden"><div class="panel">
  <h1 style="font-size:clamp(34px,8vw,54px)" data-t="shop"></h1>
  <div id="ownerBadge" class="hidden" data-t="ownerOn"></div>
  <div class="tabs" id="tabs"><button data-c="usd" data-t="tDollars"></button><button data-c="skin" data-t="tSkin"></button><button data-c="hilt" data-t="tHilt"></button><button data-c="trail" data-t="tTrail"></button><button data-c="kill" data-t="tKill"></button></div>
  <div id="shopGrid"></div>
  <div class="cos" data-t="cosmetic"></div><div id="payNote" class="hidden" data-t="pay"></div>
  <div class="coderow"><input id="codeIn" autocomplete="off"><button id="codeBtn" data-t="redeem"></button></div>
  <button class="play" id="closeShop" data-t="close" style="max-width:260px;font-size:18px;padding:10px"></button>
</div></div>
<div id="quests" class="overlay hidden"><div class="panel" style="max-width:520px">
  <h1 style="font-size:clamp(28px,6vw,42px)" data-t="quests"></h1>
  <p class="sub" id="qReset"></p>
  <div id="qList"></div>
  <div class="qdaily" id="qDaily"></div>
  <button class="play" id="qClose" data-t="close" style="max-width:260px;font-size:18px;padding:10px"></button>
</div></div>
<div id="toast"></div>
<div id="dead" class="overlay hidden"><div class="panel">
  <h1 style="font-size:clamp(40px,9vw,64px);--c:#ff2a3d" data-t="elim"></h1>

function clash(p,q,x,y){

function combat(){

  for(let i=0;i<alive.length;i++){const p=alive[i];
    for(let j=0;j<alive.length;j++){if(i===j)continue;const q=alive[j];if(!p.alive)break;
      if(!q.alive||Math.abs(p.x-q.x)>700||Math.abs(p.y-q.y)>700)continue;
      if(i<j){const w=(bladeW(p)+bladeW(q))*.5+3;outer:for(const a of segs.get(p))for(const b of segs.get(q)){const [d2,x,y]=segSegD2(a,b);if(d2<w*w){clash(p,q,x,y);break outer;}}}
      if(p.stun>0||tick-q.born<120)continue;
      const rq=radius(q.m)+bladeW(p)*.75+2;
      for(const a of segs.get(p)){const [d2,x,y]=segPointD2(a[0],a[1],a[2],a[3],q.x,q.y);if(d2<rq*rq){sparks(x,y,p.col,16,9);sparks(x,y,'#fff',8,6);kill(q,p);break;}}
    }
  }
  for(let i=0;i<alive.length;i++)for(let j=i+1;j<alive.length;j++){const p=alive[i],q=alive[j];if(!p.alive||!q.alive)continue;const dx=q.x-p.x,dy=q.y-p.y,rr=radius(p.m)+radius(q.m),d2=dx*dx+dy*dy;if(d2<rr*rr&&d2>0){const d=Math.sqrt(d2),o=(rr-d)/2,nx=dx/d,ny=dy/d;p.x-=nx*o;p.y-=ny*o;q.x+=nx*o;q.y+=ny*o;}}
}

function botThink(b){
  const r=radius(b.m),Ln=bladeLen(b),dumb=b.iq<.35;
  if(--b.reactT<=0){
    b.reactT=b.react+((Math.random()*b.react*.5)|0);
    let th=null,td=1e9,pr=null,pd=1e9;
    for(const o of players){if(!o.alive||o===b)continue;const d=Math.hypot(o.x-b.x,o.y-b.y),reach=bladeLen(o)+radius(o.m);
      if(!dumb||Math.random()<.4){if(o.m>b.m*1.8&&d<reach+r+200&&d<td){th=o;td=d;}}
      if(o.m<b.m*1.6&&d<450+350*b.iq&&d<pd&&tick-o.born>150){pr=o;pd=d;}}
    b.th=th;if(pr!==b.target){b.target=pr;b.mode='guard';b.modeT=0;}
    // parata: lama nemica in arrivo
    b.block=null;
    if(!dumb)for(const o of players){if(!o.alive||o===b)continue;const d=Math.hypot(o.x-b.x,o.y-b.y);if(d>bladeLen(o)+r+30)continue;
      if(Math.abs(o.omega||0)*bladeLen(o)>7&&Math.random()<b.iq*.6){b.block=o;break;}}
    b.aimNoise=rnd(-1,1)*(1-b.iq)*.5;
    if(!pr&&!th){let best=null,bd=1e12;for(const o of orbs){const dx=o.x-b.x,dy=o.y-b.y;if(dx>520||dx<-520||dy>520||dy<-520)continue;const d=(dx*dx+dy*dy)/(o.v+1);if(d<bd){bd=d;best=o;}}
      if(storm.on&&Math.hypot(storm.x-b.x,storm.y-b.y)<1600&&Math.random()<.6){b.wx=storm.x+rnd(-150,150);b.wy=storm.y+rnd(-150,150);}else if(best){b.wx=best.x;b.wy=best.y;}else if(!b.wx||Math.hypot(b.wx-b.x,b.wy-b.y)<80){b.wx=rnd(300,WORLD-300);b.wy=rnd(300,WORLD-300);}}
  }
  let mx=0,my=0;const th=b.th,pr=b.target;
  if(th&&th.alive){const dx=b.x-th.x,dy=b.y-th.y,d=Math.hypot(dx,dy)||1;mx=dx/d;my=dy/d;b.aimT=Math.atan2(-dy,-dx);
    if(d<bladeLen(th)+radius(th.m)+r+20&&b.iq>.5&&Math.random()<.02)dash(b);}
  else if(pr&&pr.alive){
    const dx=pr.x-b.x,dy=pr.y-b.y,d=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx),rq=radius(pr.m);
    const guardD=Ln+r+rq+22+(1-b.iq)*20;
    b.modeT++;
    if(dumb){ // avanza solo se non lo stai puntando; se la lama lo guarda, esita e indietreggia
      const pointed=Math.abs(angDiff(pr.a,Math.atan2(-dy,-dx)))<.55&&d<bladeLen(pr)+r+rq+90;
      if(pointed){mx=-dx/d*.7+(-dy/d)*.5*b.circ;my=-dy/d*.7+(dx/d)*.5*b.circ;}else{mx=dx/d;my=dy/d;}
      b.aimT=ang+b.aimNoise;
    }else if(b.mode==='guard'){
      // in guardia: lama puntata, distanza di sicurezza, gira lentamente intorno
      if(d>guardD+15){mx=dx/d;my=dy/d;}else if(d<guardD-15){mx=-dx/d;my=-dy/d;}
      mx+=-dy/d*.45*b.circ;my+=dx/d*.45*b.circ;
      b.aimT=ang+b.aimNoise*.5;
      const theirFacing=Math.abs(angDiff(pr.a,Math.atan2(-dy,-dx)));
      const opening=pr.stun>0||(theirFacing>1.1&&!pr.model.dbl)||b.counter>tick;
      if((opening&&b.modeT>12)||b.modeT>b.pat){b.mode='strike';b.modeT=0;if(b.iq>.6&&b.m>30&&d<guardD+60&&Math.random()<.4)dash(b);}
      if(Math.random()<.004)b.circ*=-1;
    }else if(b.mode==='strike'){
      // affondo: avanza con la lama puntata, piccolo fendente finale
      mx=dx/d;my=dy/d;b.aimT=ang+Math.sin(b.modeT*.25)*.35*b.circ;
      if(b.modeT>28+b.react){b.mode='back';b.modeT=0;}
    }else{ // back
      mx=-dx/d;my=-dy/d;b.aimT=ang;if(b.modeT>20+b.react||d>guardD+30){b.mode='guard';b.modeT=0;}
    }
  }else{mx=b.wx-b.x;my=b.wy-b.y;const l=Math.hypot(mx,my);if(l>1)b.aimT=Math.atan2(my,mx);}
  if(b.block&&b.block.alive){const s=segsOf(bladesAt(b.block,b.block.x,b.block.y,b.block.a))[0];b.aimT=Math.atan2((s[1]+s[3])/2-b.y,(s[0]+s[2])/2-b.x)+Math.sign(b.block.omega||1)*.2;}
  // la "mano" del bot ha una velocita' massima: niente frullate
  b.aim+=clamp(angDiff(b.aimT,b.aim),-b.hand,b.hand);
  if(b.x<150)mx+=1;if(b.x>WORLD-150)mx-=1;if(b.y<150)my+=1;if(b.y>WORLD-150)my-=1;
  b.mx=mx;b.my=my;
}

  if(ONLINE){if(!net.ok){toast(T('netWait'));return;}me.alive=false;net.join();}else{spawn(me);cam.x=me.x;cam.y=me.y;}state='play';slowT=0;spectate=null;sessUsd={kills:0,mass:0,time:0};$('topbar').classList.add('hidden');lastLv=levelOf(stats.xp);
  $('start').classList.add('hidden');deadEl.classList.add('hidden');$('hud').classList.remove('hidden');$('feed').innerHTML='';
  if(isTouch)$('mob').style.display='block';setTheme(me.col);updHud();
}
function onDeath(att){
  {const secs=(tick-me.born)/60;sessUsd.mass=Math.floor(me.best/50);sessUsd.time=Math.floor(secs/30);addUsd(sessUsd.mass+sessUsd.time,true);if(qDirty)saveQuests();
   const tot=sessUsd.kills+sessUsd.mass+sessUsd.time;$('earn').innerHTML=`<div class="er"><span>${T('eKills')}</span><span>+${sessUsd.kills}</span></div><div class="er"><span>${T('eMass')}</span><span>+${sessUsd.mass}</span></div><div class="er"><span>${T('eTime')}</span><span>+${sessUsd.time}</span></div><div class="et">${coinSvg()}<span id="earnTot">+0</span></div>`;
   let k=0;const iv=setInterval(()=>{k++;const v=Math.round(tot*Math.min(1,k/25));const e=document.getElementById('earnTot');if(e)e.textContent='+'+v;if(k>=25)clearInterval(iv);},30);}
  state='dead';me.nemId=att&&att!==me?att.id:null;spectate=att&&att!==me?att:null;stats.xp=(stats.xp||0)+Math.round(me.best*.5);saveStats();slowT=0;$('mob').style.display='none';sfx('death');
  if(me.best>stats.best){stats.best=Math.round(me.best);saveStats();}
  const s=Math.floor((tick-me.born)/60);$('killer').textContent=att?T('cutBy',{n:att.name}):T('fell');
  $('dMass').textContent=Math.round(me.best);$('dKills').textContent=me.kills;$('dTime').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  setTimeout(()=>{deadEl.classList.remove('hidden');$('hud').classList.add('hidden');$('topbar').classList.remove('hidden');refreshWallet(true);updQBadge();},550);

let shopCat='skin',shopOpen=false,confirmId=null,confirmT=0;const demoSeed=makeCSeed();
const fmtPrice=v=>{try{return new Intl.NumberFormat(lang,{style:'currency',currency:'EUR'}).format(v);}catch(e){return v.toFixed(2)+' €';}};
function toast(html,ms=3500){const t=$('toast');t.innerHTML=html;t.style.display='block';clearTimeout(toast.h);if(ms)toast.h=setTimeout(()=>t.style.display='none',ms);}
function drawPreview(c,it,t){const g=c.getContext('2d'),W=c.width,H=c.height,col=selCol<0?previewCol:COLORS[selCol];g.clearRect(0,0,W,H);
  if(it.cat==='skin'){drawSkin(g,W/2,H/2,H*.22,it.id,col,demoSeed,t,false,Math.sin(t*.02)*.8,Math.cos(t*.02),0);}
  else if(it.cat==='hilt'){const r=92,cx=-r*.2,cy=H*.56,M=MODELS[0],a=-.1+Math.sin(t*.03)*.05,c=Math.cos(a),s=Math.sin(a);const L=W-r*1.05+r*.2-16,bx=cx+c*r*1.05,by=cy+s*r*1.05,pts=[[bx,by],[bx+c*L,by+s*L]];
    drawHilt(g,cx,cy,a,r,col,M,it.id,t);drawBladePoly(g,pts,col,9,1,M,t);bladeFx(g,pts,col,9,it.id,t);}
  else if(it.cat==='trail'){const cx=W*.3,cy=H*.78,L=W*.55,TR=[];for(let i=0;i<10;i++){const a=-.25-((t*.06)%1.2)-i*.09;TR.push([[cx+Math.cos(a)*14,cy+Math.sin(a)*14,cx+Math.cos(a)*L,cy+Math.sin(a)*L]]);}
    g.globalCompositeOperation='lighter';drawTrail(g,TR,it.id,col,1,t);g.globalCompositeOperation='source-over';const A=TR[0][0];drawBladePoly(g,[[A[0],A[1]],[A[2],A[3]]],col,5,1,MODELS[0],t);g.fillStyle='#2a2e36';g.beginPath();g.arc(cx,cy,10,0,TAU);g.fill();g.strokeStyle=col;g.lineWidth=2;g.stroke();}
  else{const x=W/2,y=H/2;g.globalCompositeOperation='lighter';
    if(it.id==='k_bolt'){for(let i=0;i<5;i++){const a=i/5*TAU+t*.05;g.strokeStyle=i?'#bfe8ff':col;g.lineWidth=2;boltPath(g,x,y,x+Math.cos(a)*H*.45,y+Math.sin(a)*H*.45,6);g.stroke();}}
    else if(it.id==='k_vortex'){g.save();g.translate(x,y);g.rotate(t*.1);g.strokeStyle=col;g.lineWidth=2.5;for(let a=0;a<4;a++){g.beginPath();for(let s=0;s<20;s++){const rr=H*.42*(1-s/20),an=a*TAU/4+s*.32;s?g.lineTo(Math.cos(an)*rr,Math.sin(an)*rr):g.moveTo(Math.cos(an)*rr,Math.sin(an)*rr);}g.stroke();}g.restore();g.globalCompositeOperation='source-over';g.fillStyle='#000';g.beginPath();g.arc(x,y,6,0,TAU);g.fill();}
    else if(it.id==='k_fire'){for(const [bx,by,h] of [[x-W*.2,y-4,(t*3)%360],[x+W*.18,y-10,(t*3+120)%360],[x,y+12,(t*3+240)%360]])for(let k=0;k<18;k++){const a=k/18*TAU,d=8+((t*.6)%14);g.fillStyle=`hsl(${(h+k*6)%360},100%,62%)`;g.fillRect(bx+Math.cos(a)*d,by+Math.sin(a)*d,2.5,2.5);}}
    else{for(let k=0;k<14;k++){const a=k/14*TAU,d=10+((t*.5)%16);g.strokeStyle=k%2?'#fff':col;g.lineWidth=2;g.beginPath();g.moveTo(x+Math.cos(a)*d,y+Math.sin(a)*d);g.lineTo(x+Math.cos(a)*(d+8),y+Math.sin(a)*(d+8));g.stroke();}}
    g.globalCompositeOperation='source-over';}
}
function renderShop(){
  $('ownerBadge').classList.toggle('hidden',!owner);$('payNote').classList.toggle('hidden',!(PAYMENT_LINK||Object.keys(PAY_LINKS).length));
  [...$('tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.c===shopCat));
  const grid=$('shopGrid');grid.innerHTML='';
  if(shopCat==='usd'){for(const pk of PACKS){const d=document.createElement('div');d.className='item pack'+(pk.tag?' rL':'');if(pk.tag){d.style.setProperty('--rc','#ffd23d');d.style.borderColor='#ffd23d88';}
      d.innerHTML=`${pk.tag?`<span class="rb" style="color:#ffd23d">${T(pk.tag)}</span>`:''}${pk.bonus?`<span class="bb">${T('bonusP',{n:pk.bonus})}</span>`:''}<canvas width="300" height="168"></canvas><div class="amt">${coinSvg()}${fmtUsd(pk.usd)}</div><div class="row2"><button class="bBuy">${fmtPrice(pk.eur)}</button>${owner?'<button class="bCode" title="code">🎟</button>':''}</div>`;
      d.querySelector('.bBuy').onclick=()=>{const PL=PAY_LINKS[pk.id]||PAYMENT_LINK;if(PL){const a=document.createElement('a');a.href=PL+(PL.includes('?')?'&':'?')+'client_reference_id='+encodeURIComponent(pk.id);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();toast(T('payNote'),6000);}else toast(T('payOff'));};
      const cB=d.querySelector('.bCode');if(cB)cB.onclick=()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',nonce=Array.from({length:4},()=>A[(Math.random()*A.length)|0]).join(''),code=packCode(pk.id,nonce),stat=packCode(pk.id);
        toast(`${T('codeFor')} <b>${fmtUsd(pk.usd)} $</b><code>${code}</code><div style="font-size:11px;color:#8792ab;word-break:break-all;margin-bottom:6px">Stripe → redirect: ${GAME_URL}#${stat}</div><button id="cpy" style="background:#ffd23d">${T('copy')}</button><button id="tcl" style="background:#2a2e36;color:#fff">${T('close')}</button>`,0);
        $('cpy').onclick=()=>{try{navigator.clipboard.writeText(code).then(()=>$('cpy').textContent='✓',()=>{});}catch(e){}};$('tcl').onclick=()=>$('toast').style.display='none';};
      grid.appendChild(d);}
    drawShopPreviews();return;}
  for(const it of SHOP.filter(s=>s.cat===shopCat)){
    const mine=hasItem(it.id),isEq=eq[it.cat]===it.id,d=document.createElement('div'),rr2=rarityOf(it);d.className='item'+(isEq?' eq':'')+(rr2?' r'+rr2:'');if(rr2){d.style.setProperty('--rc',RCOL[rr2]);if(!isEq)d.style.borderColor=RCOL[rr2]+'66';}
    const priceLbl=it.price===0?T('free'):owner?T('free')+' · OWNER':(confirmId===it.id&&Date.now()<confirmT)?T('confirm')+' '+coinSvg()+fmtUsd(usdOf(it)):coinSvg()+fmtUsd(usdOf(it));
    d.innerHTML=`${rr2?`<span class="rb" style="color:${RCOL[rr2]}">${T('r'+rr2)}</span>`:''}<canvas width="300" height="168"></canvas><b>${it.n}</b>${PCT[it.id]?`<div class="perk">${perkTxt(it.id)}</div>`:''}${it.cat==='hilt'||it.cat==='skin'?`<div class="desc">${(()=>{const D=(it.cat==='hilt'?HDESC:SDESC)[it.id]||{};return D[lang]||D.en||'';})()}</div>`:''}<div class="row2">${isEq?`<button class="bIn">${T('equipped')}</button>`:mine?`<button class="bEq">${T('equip')}</button>`:`<button class="bBuy pbtn">${priceLbl}</button>`}${owner&&it.price>0?'<button class="bCode" title="code">🎟</button>':''}</div>`;
    const eqB=d.querySelector('.bEq');if(eqB)eqB.onclick=()=>{eq[it.cat]=it.id;saveShop();renderShop();};
    const buyB=d.querySelector('.bBuy');if(buyB)buyB.onclick=()=>{const cost=usdOf(it);
      if(wallet()<cost){toast(`${T('notEnough')} — ${coinSvg()} ${fmtUsd(cost-wallet())}`);shopCat='usd';renderShop();return;}
      if(confirmId!==it.id||Date.now()>confirmT){confirmId=it.id;confirmT=Date.now()+3000;renderShop();return;}
      confirmId=null;addUsd(-cost);owned.add(it.id);eq[it.cat]=it.id;saveShop();toast('✓ '+T('bought')+' — <b>'+it.n+'</b>');tone(660,1320,.25,'triangle',.06);renderShop();};
    const cB=d.querySelector('.bCode');if(cB)cB.onclick=()=>{const code=itemCode(it.id);toast(`${T('codeFor')} <b>${it.n}</b><code>${code}</code><div style="font-size:11px;color:#8792ab;word-break:break-all;margin-bottom:6px">Stripe → redirect: ${GAME_URL}#${code}</div><button id="cpy" style="background:#ffd23d">${T('copy')}</button><button id="tcl" style="background:#2a2e36;color:#fff">${T('close')}</button>`,0);
      $('cpy').onclick=()=>{try{navigator.clipboard.writeText(code).then(()=>$('cpy').textContent='✓',()=>{});}catch(e){}};$('tcl').onclick=()=>$('toast').style.display='none';};
    grid.appendChild(d);
  }
  drawShopPreviews();
}
function drawPack(c,pk,t){const g=c.getContext('2d'),W=c.width,H=c.height;g.clearRect(0,0,W,H);const n=Math.min(16,2+Math.round(Math.log2(pk.usd/250)*2.4));g.globalCompositeOperation='lighter';g.globalAlpha=.35+.1*Math.sin(t*.05);g.drawImage(glow('#ffd23d'),W/2-110,H/2-90,220,180);g.globalAlpha=1;g.globalCompositeOperation='source-over';
  const stacks=Math.min(5,Math.ceil(n/4));for(let s=0;s<stacks;s++){const cnt=Math.ceil(n/stacks),sx=W/2+(s-(stacks-1)/2)*44;for(let i=0;i<cnt;i++){const y=H*.78-i*9+Math.sin(t*.04+s)*1.5;g.drawImage(COIN_IMG,sx-24,y-24,48,48);}}}
function drawShopPreviews(){if(shopCat==='usd'){[...$('shopGrid').children].forEach((d,i)=>drawPack(d.querySelector('canvas'),PACKS[i],tick+performance.now()/16));return;}const its=SHOP.filter(s=>s.cat===shopCat);[...$('shopGrid').children].forEach((d,i)=>drawPreview(d.querySelector('canvas'),its[i],tick+performance.now()/16));}
function redeem(){const raw=$('codeIn').value.trim().toUpperCase();if(!raw)return;
  if(cyrb53(raw)===OWNER_H){owner=true;try{localStorage.setItem('plasma_owner','1');}catch(e){}toast('👑 '+T('ownerOn'));}
  else if(redeemPack(raw)){}
  else{const it=SHOP.find(s=>s.price>0&&itemCode(s.id)===raw);if(it){owned.add(it.id);eq[it.cat]=it.id;saveShop();shopCat=it.cat;toast('✓ '+T('okCode')+' — '+it.n);}else{toast('✕ '+T('badCode'));return;}}
  $('codeIn').value='';renderShop();}
function redeemPack(raw){const m=raw.match(/^PLS-(D\d+)(?:-([A-Z0-9]{4}))?-([A-Z0-9]{6})$/);if(!m)return false;const pk=PACKS.find(x=>x.id===m[1].toLowerCase());if(!pk||packCode(pk.id,m[2])!==raw)return false;
  if(redeemed.has(raw)){toast('✕ '+T('usedCode'));return true;}redeemed.add(raw);try{localStorage.setItem('plasma_red',JSON.stringify([...redeemed]));}catch(e){}addUsd(pk.usd);toast(coinSvg()+' '+T('packOk',{n:fmtUsd(pk.usd)}),5000);tone(523,1046,.4,'triangle',.07);tone(784,1568,.4,'triangle',.05,.12);return true;}
function hashUnlock(){const raw=(location.hash||'').slice(1).toUpperCase();if(!raw||!raw.startsWith('PLS-'))return;if(redeemPack(raw)){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}if(shopOpen)renderShop();return;}const it=SHOP.find(s=>s.price>0&&itemCode(s.id)===raw);if(!it)return;
  owned.add(it.id);eq[it.cat]=it.id;saveShop();try{history.replaceState(null,'',location.pathname+location.search);}catch(e){try{location.hash='';}catch(e2){}}toast('✓ '+T('okCode')+' — <b>'+it.n+'</b>',6000);if(shopOpen)renderShop();}
addEventListener('hashchange',hashUnlock);setTimeout(hashUnlock,300);

function frame(t){const dt=Math.min(100,t-last);last=t;if(slowT>0){slowT-=dt;timeScale=.4;}else timeScale=1;
  acc+=dt*timeScale;let n=0;while(acc>=16.667&&n<4){update();acc-=16.667;n++;}if(n===4)acc=0;
  ALPHA=clamp(acc/16.667,0,1);updCam(dt);render();requestAnimationFrame(frame);}
